name: wr30u

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        required: true
        default: "chasey-25.12"
        type: choice
        options:
          - chasey-25.12

env:
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential libncurses5-dev gawk git libssl-dev zlib1g-dev wget curl python3 python3-pip rsync unzip

      - name: Clone source code
        run: |
          git clone -q --single-branch --depth=1 --branch=25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          echo "源码克隆完成"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 👇 检查包到底存不存在 👇
      - name: Check if packages exist in source
        run: |
          cd openwrt
          echo "========== 检查源码中是否有这些包 =========="
          if [ -d "package/feeds/luci/luci-theme-argon" ]; then echo "✅ Argon 源码存在"; else echo "❌ Argon 源码不在 feed 里！"; fi
          if [ -d "package/feeds/packages/mwan3" ]; then echo "✅ mwan3 源码存在"; else echo "❌ mwan3 源码不在 feed 里！"; fi
          if [ -d "package/kernel/mtd-rw" ]; then echo "✅ mtd-rw 源码存在"; else echo "❌ mtd-rw 源码不存在！"; fi
          echo "=========================================="

      - name: Load custom configuration
        run: |
          cd openwrt
          cp -f ${GITHUB_WORKSPACE}/${CONFIG_FILE} .config
          
          # 核心操作：强行把这三个包追加到配置末尾，并且再跑一次 defconfig
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mtd-rw=y" >> .config
          
          echo "========== 跑 make defconfig 看看会不会吃包 =========="
          # 这里会打印出到底是因为缺什么依赖导致了被吃
          make defconfig V=s 2>&1 | tee defconfig.log
          
          echo "========== 检查最终生成的 .config =========="
          grep -q "CONFIG_PACKAGE_luci-theme-argon=y" .config && echo "✅ Argon 保留了" || echo "❌ Argon 被吃掉了"
          grep -q "CONFIG_PACKAGE_mwan3=y" .config && echo "✅ mwan3 保留了" || echo "❌ mwan3 被吃掉了"
          grep -q "CONFIG_PACKAGE_kmod-mtd-rw=y" .config && echo "✅ mtd-rw 保留了" || echo "❌ mtd-rw 被吃掉了"

      - name: Compile the OpenWrt
        id: compile
        run: |
          cd openwrt
          echo "开始编译..."
          make -j$(($(nproc) + 1)) V=s || make -j1 V=s
