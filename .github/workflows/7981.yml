name: wr30u

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        required: true
        default: "chasey-25.12"
        type: choice
        options:
          - chasey-25.12

env:
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential libncurses5-dev gawk git libssl-dev zlib1g-dev wget curl python3 python3-pip rsync unzip

      - name: Clone source code
        run: |
          git clone -q --single-branch --depth=1 --branch=25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          echo "[INFO] Source code cloned."

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "[INFO] Feeds updated."

      - name: Fix source dependencies
        run: |
          cd openwrt
          echo "[INFO] Removing weechat to prevent recursive dependency..."
          rm -rf package/feeds/luci/luci-app-weechat
          rm -rf tmp/
          
          echo "[INFO] Fetching kmod-mtd-rw source..."
          git clone --depth=1 https://github.com/openwrt/packages.git package/kernel/mtd-rw-tmp
          mv package/kernel/mtd-rw-tmp/kernel/mtd-rw package/kernel/mtd-rw
          rm -rf package/kernel/mtd-rw-tmp

      - name: Load custom configuration
        run: |
          cd openwrt
          cp -f ${GITHUB_WORKSPACE}/${CONFIG_FILE} .config
          
          # 强行确保这两个包被选中 (不包含 mwan3)
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mtd-rw=y" >> .config
          
          echo "[INFO] Running make defconfig..."
          make defconfig
          
          echo "[INFO] Verifying target configuration..."
          if grep -q "CONFIG_PACKAGE_luci-theme-argon=y" .config; then echo "[SUCCESS] Argon theme is included."; else echo "[ERROR] Argon theme was removed."; fi
          if grep -q "CONFIG_PACKAGE_kmod-mtd-rw=y" .config; then echo "[SUCCESS] mtd-rw is included."; else echo "[ERROR] mtd-rw was removed."; fi
          if grep -q "CONFIG_PACKAGE_kmod-mt_wifi=y" .config; then echo "[SUCCESS] MTK Wi-Fi driver is included."; else echo "[ERROR] MTK Wi-Fi driver is missing."; fi
          if grep -q "CONFIG_PACKAGE_kmod-macvlan=y" .config; then echo "[SUCCESS] mwan3 base dependency is included."; else echo "[ERROR] mwan3 dependency is missing."; fi

      - name: Compile the OpenWrt
        id: compile
        run: |
          cd openwrt
          make download -j8
          echo "[INFO] Starting compilation with multi-threading..."
          make -j$(($(nproc) + 1)) V=s || make -j1 V=s
          echo "[INFO] Compilation finished."

      - name: Check firmware output
        run: |
          ls -lh openwrt/bin/targets/*/*/
          if ! ls openwrt/bin/targets/*/*/*.itb openwrt/bin/targets/*/*/*.bin 2>/dev/null; then
            echo "[ERROR] Build failed: No firmware file generated. Aborting upload."
            exit 1
          fi
          echo "[INFO] Firmware files verified."

      - name: Upload firmware and packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_and_packages
          path: |
            openwrt/bin/targets/*/*/*.itb
            openwrt/bin/targets/*/*/*.bin
            openwrt/bin/targets/*/*/packages/
