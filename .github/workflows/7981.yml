name: wr30u
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        required: true
        default: "chasey-25.12"
        type: choice
        options:
          - chasey-25.12

env:
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential libncurses5-dev gawk git libssl-dev zlib1g-dev wget curl python3 python3-pip rsync unzip

      - name: Clone source code
        run: |
          git clone -q --single-branch --depth=1 --branch=25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          echo "源码克隆完成"

      - name: Load custom configuration
        run: |
          cp -f ${CONFIG_FILE} openwrt/.config

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download package
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name: Compile the OpenWrt
        id: compile
        run: |
          cd openwrt
          echo "开始编译，使用多线程..."
          make -j$(($(nproc) + 1)) V=s || make -j1 V=s
          echo "编译完成"

      - name: Check firmware
        run: |
          ls -lh openwrt/bin/targets/*/*/
          if ! ls openwrt/bin/targets/*/*/*.itb openwrt/bin/targets/*/*/*.bin 2>/dev/null; then
            echo "🚨 编译失败：没有生成 .itb 或 .bin 固件文件！"
            exit 1
          fi

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: openwrt/bin/targets/*/*
