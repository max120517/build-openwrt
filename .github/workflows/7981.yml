name: wr30u

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        required: true
        default: "chasey-25.12"
        type: choice
        options:
          - chasey-25.12

env:
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential libncurses5-dev gawk git libssl-dev zlib1g-dev wget curl python3 python3-pip rsync unzip

      - name: Clone source code
        run: |
          git clone -q --single-branch --depth=1 --branch=25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          echo "源码克隆完成"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 👇 外科手术：拔除引起冲突的 weechat 插件，并拉取 mtd-rw 源码 👇
      - name: Fix source dependencies
        run: |
          cd openwrt
          echo "========== 修复循环依赖 =========="
          # 直接删除引起循环依赖的文件夹
          rm -rf package/feeds/luci/luci-app-weechat
          # 清理配置缓存
          rm -rf tmp/
          
          echo "========== 下载 kmod-mtd-rw 源码 =========="
          # 从 OpenWrt 官方 packages 仓库直接拉取 mtd-rw
          git clone --depth=1 https://github.com/openwrt/packages.git package/kernel/mtd-rw-tmp
          mv package/kernel/mtd-rw-tmp/kernel/mtd-rw package/kernel/mtd-rw
          rm -rf package/kernel/mtd-rw-tmp
          
      - name: Load custom configuration
        run: |
          cd openwrt
          cp -f ${GITHUB_WORKSPACE}/${CONFIG_FILE} .config
          
          # 强行确保这三个包被选中
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mtd-rw=y" >> .config
          
          echo "========== 再次跑 make defconfig =========="
          make defconfig
          
          echo "========== 最终检查 =========="
          grep -q "CONFIG_PACKAGE_luci-theme-argon=y" .config && echo "✅ Argon 保留" || echo "❌ Argon 丢失"
          grep -q "CONFIG_PACKAGE_mwan3=y" .config && echo "✅ mwan3 保留" || echo "❌ mwan3 丢失"
          grep -q "CONFIG_PACKAGE_kmod-mtd-rw=y" .config && echo "✅ mtd-rw 保留" || echo "❌ mtd-rw 丢失"

      - name: Compile the OpenWrt
        id: compile
        run: |
          cd openwrt
          make download -j8
          echo "开始编译，使用多线程..."
          make -j$(($(nproc) + 1)) V=s || make -j1 V=s
          echo "编译完成"

      - name: Upload firmware and packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_and_ipk
          path: |
            openwrt/bin/targets/*/*/*.itb
            openwrt/bin/targets/*/*/*.bin
            openwrt/bin/targets/*/*/packages/
