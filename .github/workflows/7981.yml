name: wr30u

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Select the source branch"
        required: true
        default: "chasey-25.12"
        type: choice
        options:
          - chasey-25.12

env:
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential libncurses5-dev gawk git libssl-dev zlib1g-dev wget curl python3 python3-pip rsync unzip

      - name: Clone source code
        run: |
          git clone -q --single-branch --depth=1 --branch=25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          echo "源码克隆完成"

      - name: Load custom configuration
        run: |
          cp -f ${CONFIG_FILE} openwrt/.config

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download package
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name: Verify config (检查配置是否生效)
        run: |
          cd openwrt
          echo "========== 检查最终生成的 .config =========="
          if grep -q "CONFIG_PACKAGE_luci-theme-argon=y" .config; then
            echo "✅ 成功：Argon 主题已包含！"
          else
            echo "❌ 失败：Argon 主题被系统剔除了！"
          fi
          
          if grep -q "CONFIG_PACKAGE_mwan3=y" .config; then
            echo "✅ 成功：mwan3 已包含！"
          else
            echo "❌ 失败：mwan3 被系统剔除了！"
          fi

          if grep -q "CONFIG_PACKAGE_kmod-mtd-rw=y" .config; then
            echo "✅ 成功：kmod-mtd-rw 已包含！"
          else
            echo "❌ 失败：kmod-mtd-rw 被系统剔除了！"
          fi
          echo "=========================================="

      - name: Compile the OpenWrt
        id: compile
        run: |
          cd openwrt
          echo "开始编译，使用多线程..."
          make -j$(($(nproc) + 1)) V=s || make -j1 V=s
          echo "编译完成"

      - name: Upload firmware and packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_and_ipk
          path: |
            openwrt/bin/targets/*/*/*.itb
            openwrt/bin/targets/*/*/*.bin
            openwrt/bin/targets/*/*/packages/
